name: Build and Push Docker Image

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Keyless signing: the OIDC token is what Fulcio turns into a signing cert.
  id-token: write
  # Lets actions/attest-build-provenance store the provenance attestation.
  attestations: write

jobs:
  build:
    # Fork PRs never run on the self-hosted runners: they sit inside the cluster.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab-dind
    
    steps:
    - uses: actions/checkout@v6
      with:
        repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    
    - name: Set up Docker Buildx (remote buildkitd)
      uses: docker/setup-buildx-action@v4
      with:
        driver: remote
        endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234
        driver-opts: |
          cacert=/etc/buildkit/certs/ca.crt
          cert=/etc/buildkit/certs/tls.crt
          key=/etc/buildkit/certs/tls.key
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set version vars
      id: vars
      run: |
        DATE=$(date +'%Y%m%d')
        TIME=$(date +'%H%M%S')
        SHA=$(git rev-parse --short HEAD)
        echo "date=$DATE" >> $GITHUB_OUTPUT
        echo "time=$TIME" >> $GITHUB_OUTPUT
        echo "sha=$SHA" >> $GITHUB_OUTPUT
        echo "event_name=${{ github.event_name }}" >> $GITHUB_OUTPUT
        echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
        if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
          VERSIONED_TAG="ghcr.io/wielandtech-labs/w_tech:${DATE}-${TIME}-${SHA}"
          echo "release_tag=${DATE}-${TIME}-${SHA}" >> $GITHUB_OUTPUT
          echo "versioned_tag=${VERSIONED_TAG}" >> $GITHUB_OUTPUT
          echo "Created versioned tag: ${VERSIONED_TAG}"
        elif [ "${{ github.event_name }}" == "push" ]; then
          DEV_TAG="ghcr.io/wielandtech-labs/w_tech:dev-${DATE}-${TIME}-${SHA}"
          echo "dev_tag=dev-${DATE}-${TIME}-${SHA}" >> $GITHUB_OUTPUT
          echo "Created dev tag: ${DEV_TAG}"
        elif [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]; then
          PR_TAG="ghcr.io/wielandtech-labs/w_tech:pr-${{ github.event.pull_request.number }}-${SHA}"
          echo "pr_tag=pr-${{ github.event.pull_request.number }}-${SHA}" >> $GITHUB_OUTPUT
          echo "Created review app tag: ${PR_TAG}"
        else
          echo "Skipping registry promotion tag (not a push event)"
        fi
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/wielandtech-labs/w_tech
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ steps.vars.outputs.release_tag }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          type=raw,value=${{ steps.vars.outputs.dev_tag }},enable=${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
          type=raw,value=${{ steps.vars.outputs.pr_tag }},enable=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    
    # Gate the image on the test suite. Runs in the remote buildkitd (the
    # runner has no Docker daemon); a failing test fails this `build` job.
    - name: Run Django tests
      uses: docker/build-push-action@v7
      with:
        context: .
        target: test
        push: false
        outputs: type=cacheonly

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      id: build
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Remote buildkitd handles its own layer + cache-mount persistence via
        # the PVC. No gha cache needed.
        cache-to: type=inline

    # --- Supply chain (w_homelab#1571): sign, SBOM, provenance ---
    # Everything below addresses the pushed image by digest, never by tag, so
    # it covers all tags of this build (pr-*, dev-*, prod). The steps are
    # fail-closed: a signing failure fails `build` instead of leaving an
    # unsigned image behind a green check. Fork PRs never get here (job-level
    # `if`), so the missing OIDC token there is not a problem.
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Sign image (cosign keyless)
      env:
        IMAGE: ghcr.io/wielandtech-labs/w_tech
        DIGEST: ${{ steps.build.outputs.digest }}
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "$DIGEST" ]; then
          echo "::error::build step reported no image digest; nothing to sign"
          exit 1
        fi
        cosign sign --yes "${IMAGE}@${DIGEST}"

    - name: Install syft
      id: syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

    # No Docker daemon on the runner, so syft reads the image from the registry
    # (credentials come from the docker login above).
    - name: Generate SBOM and attest it (syft + cosign)
      env:
        IMAGE: ghcr.io/wielandtech-labs/w_tech
        DIGEST: ${{ steps.build.outputs.digest }}
        SYFT: ${{ steps.syft.outputs.cmd }}
      shell: bash
      run: |
        set -euo pipefail
        "$SYFT" scan "registry:${IMAGE}@${DIGEST}" -o "spdx-json=${RUNNER_TEMP}/sbom.spdx.json"
        cosign attest --yes --type spdxjson \
          --predicate "${RUNNER_TEMP}/sbom.spdx.json" "${IMAGE}@${DIGEST}"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ghcr.io/wielandtech-labs/w_tech
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
        # Storage records need the extra `artifact-metadata: write` permission.
        create-storage-record: false

    - name: Dispatch review app update
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      env:
        HOMELAB_REVIEW_APP_TOKEN: ${{ secrets.HOMELAB_REVIEW_APP_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        IMAGE_TAG: ${{ steps.vars.outputs.pr_tag }}
        SHORT_SHA: ${{ steps.vars.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail

        if [ -z "${HOMELAB_REVIEW_APP_TOKEN:-}" ]; then
          echo "HOMELAB_REVIEW_APP_TOKEN is not set; skipping review app update dispatch."
          exit 0
        fi

        jq -n \
          --arg action "upsert" \
          --arg pr_number "$PR_NUMBER" \
          --arg source_repo "$GITHUB_REPOSITORY" \
          --arg source_pr_url "$PR_URL" \
          --arg image_tag "$IMAGE_TAG" \
          --arg short_sha "$SHORT_SHA" \
          '{
            event_type: "w-tech-review-app",
            client_payload: {
              action: $action,
              pr_number: ($pr_number | tonumber),
              source_repo: $source_repo,
              source_pr_url: $source_pr_url,
              image_tag: $image_tag,
              short_sha: $short_sha
            }
          }' \
          | curl --fail-with-body -sS \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${HOMELAB_REVIEW_APP_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/wielandtech-labs/w_homelab/dispatches \
              --data-binary @- \
          || echo "::warning::review-app dispatch failed (HOMELAB_REVIEW_APP_TOKEN may need wielandtech-labs access) — continuing without blocking the build"
